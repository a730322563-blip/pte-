name: Build pte_track.ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            python3 git ccache wget gnupg

      - name: Install clang-17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
          sudo apt-get update
          sudo apt-get install -y clang-17 lld-17 llvm-17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llc-17 /usr/bin/llc
          clang --version

      - name: Download Android Common Kernel (android15-6.6)
        run: |
          git clone --depth 1 -b android15-6.6 \
            https://android.googlesource.com/kernel/common kernel-src
          du -sh kernel-src

      - name: Configure GKI
        run: |
          cd kernel-src
          make ARCH=arm64 gki_defconfig

      - name: Patch only incompatible flags (safe sed)
        run: |
          cd kernel-src
          # 只删独立的 -fconserve-stack（前面带空格，不会误伤 -Wno-error）
          grep -rl " -fconserve-stack" . --include="*.mk" --include="Makefile*" --include="Kbuild*" 2>/dev/null | xargs -r sed -i 's/ -fconserve-stack//g'
          # bounds-strict 降级为 bounds（安全替换）
          grep -rl "bounds-strict" . --include="*.mk" --include="Makefile*" --include="Kbuild*" 2>/dev/null | xargs -r sed -i 's/bounds-strict/bounds/g'
          echo "Patch done"

      - name: Build pte_track.ko
        run: |
          make KDIR=kernel-src LLVM=1 LLVM_IAS=1 ARCH=arm64 KCFLAGS="-Wno-unknown-warning-option"
          ls -l pte_track.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pte_track-ko
          path: pte_track.ko
